[workspace]
members = [
    "crates/urci-common",
    "crates/urci-db-adapter",
    "crates/urci-bls-merkle",
    "crates/urci-tracing",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/siddharthv1/urci"
authors = ["Siddharth Vaderaa"]
rust-version = "1.90"

[workspace.dependencies]
# Ethereum types and utilities
alloy-primitives = { version = "1.3.1", features = ["serde"] }
alloy-sol-types = "1.3.1"
alloy-rpc-types = "1.0.30"
alloy-rpc-types-eth = "1.0.30"
alloy-network = "1.0.30"
alloy-genesis = "1.0.30"
alloy-consensus = "1.0.30"
alloy-eips = "1.0.30"

# Reth dependencies for EVM execution (needed by urci-bls-merkle and urci-tracing)
reth-execution-types = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-evm = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-revm = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-rpc-eth-api = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-rpc-convert = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }
reth-testing-utils = { git = "https://github.com/paradigmxyz/reth", version = "1.6.0" }

# REVM for EVM execution
revm = { version = "29.0.0", default-features = false, features = ["std", "tracer"] }
revm-inspector = { version = "10.0.0" }
revm-inspectors = { version = "0.29.1" }

# Async runtime
async-trait = "0.1.89"
tokio = { version = "1.38", features = ["full", "tracing"] }
futures = "0.3"
futures-util = "0.3"

# OpenAPI (optional - only used when building with utoipa feature)
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling 
eyre = "0.6"
thiserror = "1.0"

# Logging and metrics 
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.26", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.26", features = ["tonic", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Message queue (from advice.md)
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Crypto
secp256k1 = { version = "0.29", default-features = false, features = ["std"] }
sha2 = "0.10"
sha3 = "0.10"

# Utilities
derive_more = { version = "1.0", features = ["full"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
bigdecimal = "0.4"
testcontainers = "0.25"
dashmap = "6.1"

# Foundry for contract compilation
foundry-compilers = "0.11"
foundry-config = "0.2"

# Metrics
prometheus = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
panic = "abort"

[profile.dev]
opt-level = 1

[profile.bench]
inherits = "release"

