[profile.default]
src = "."
out = "out"
libs = ["../../../contracts/urc/lib"]
# Allow access to URC contracts
allow_paths = ["../../../contracts/urc/src"]
remappings = [
    # Point to the actual URC contracts
    "urc/=../../../contracts/urc/src/",
    # Solady library
    "solady/=../../../contracts/urc/lib/solady/src/",
    # OpenZeppelin if needed
    "@openzeppelin/=../../../contracts/urc/lib/openzeppelin-contracts/",
]

# Solidity version
solc_version = "0.8.24"

# Optimizer settings
optimizer = true
optimizer_runs = 200

# Other settings
auto_detect_solc = false
ffi = false